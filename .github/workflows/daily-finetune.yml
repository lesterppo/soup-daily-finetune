name: Daily LoRA Fine-tune (Colab T4 + Google Drive)

on:
  schedule:
    # 10:00 PM HKT (14:00 UTC) daily
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      rows:
        description: "finance-alpaca subset size (small = smoke test; 2000 = daily)"
        required: false
        default: "2000"
      save_steps:
        description: "Drive checkpoint every N training steps (timeout safety net)"
        required: false
        default: "100"
      max_minutes:
        description: "Stop training after N minutes and save a final checkpoint (0 = unlimited)"
        required: false
        default: "100"
      train_timeout:
        description: "Runner poll budget in minutes (default: max_minutes + 25; unlimited mode: 240)"
        required: false
        default: ""
      epochs:
        description: "Training epochs per run (default 1). Use >1 with max_minutes=0 to train until the VM is recycled (~12h window)."
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: soup-daily
  cancel-in-progress: false

jobs:
  finetune:
    runs-on: ubuntu-latest
    # Runner budget: setup (~12 min) + max_minutes of training + slack; for
    # unlimited runs (max_minutes=0) the runner observes up to TRAIN_TIMEOUT_MIN
    # (default 240) then exits leaving the VM training. 400 covers the max.
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Patch jupyter-kernel-client compat (colab-cli 0.6.0 bug)
        # google-colab-cli 0.6.0's runtime.py calls jupyter_kernel_client.KernelClient,
        # renamed to JupyterKernelClient in jupyter-kernel-client 1.0.0 -> AttributeError
        # on exec_detach. Same sed fix Peter applies locally via ~/colab_cli_patched.
        run: |
          python - <<'EOF'
          import pathlib, colab_cli.runtime
          p = pathlib.Path(colab_cli.runtime.__file__)
          src = p.read_text()
          fixed = src.replace("jupyter_kernel_client.KernelClient(", "jupyter_kernel_client.JupyterKernelClient(")
          if fixed != src:
              p.write_text(fixed)
              print(f"patched {p}: KernelClient -> JupyterKernelClient")
          else:
              print(f"{p}: no patch needed")
          EOF

      - name: Run daily fine-tune
        env:
          COLAB_CLIENT_ID: ${{ secrets.COLAB_CLIENT_ID }}
          COLAB_CLIENT_SECRET: ${{ secrets.COLAB_CLIENT_SECRET }}
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
          GDRIVE_ADC: ${{ secrets.GDRIVE_ADC }}
          DRIVE_ADAPTER_IN: ${{ secrets.DRIVE_ADAPTER_IN }}
          DRIVE_RESULTS: ${{ secrets.DRIVE_RESULTS }}
          RUN_ROWS: ${{ github.event.inputs.rows || '2000' }}
          RUN_SAVE_STEPS: ${{ github.event.inputs.save_steps || '100' }}
          RUN_MAX_MINUTES: ${{ github.event.inputs.max_minutes || '100' }}
          RUN_EPOCHS: ${{ github.event.inputs.epochs || '1' }}
          # Optional runner poll budget override in MINUTES (default in
          # run_daily.py: max_minutes + 25). Must outlive the VM's setup
          # (~12 min) + training, else the runner times out first.
          TRAIN_TIMEOUT_MIN: ${{ github.event.inputs.train_timeout }}
        run: python run_daily.py

      - name: Upload artifacts (metrics + adapter config)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: finetune-output
          path: |
            out/
          if-no-files-found: ignore
          retention-days: 14
