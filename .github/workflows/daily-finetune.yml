name: Daily LoRA Fine-tune (Colab T4 + Google Drive)

on:
  schedule:
    # 10:00 PM HKT (14:00 UTC) daily
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      rows:
        description: "finance-alpaca subset size (small = smoke test; 2000 = daily)"
        required: false
        default: "2000"
      save_steps:
        description: "Drive checkpoint every N training steps (timeout safety net)"
        required: false
        default: "100"
      max_minutes:
        description: "Stop training after N minutes and save a final checkpoint (0 = unlimited)"
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: soup-daily
  cancel-in-progress: false

jobs:
  finetune:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily fine-tune
        env:
          COLAB_CLIENT_ID: ${{ secrets.COLAB_CLIENT_ID }}
          COLAB_CLIENT_SECRET: ${{ secrets.COLAB_CLIENT_SECRET }}
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
          GDRIVE_ADC: ${{ secrets.GDRIVE_ADC }}
          DRIVE_ADAPTER_IN: ${{ secrets.DRIVE_ADAPTER_IN }}
          DRIVE_RESULTS: ${{ secrets.DRIVE_RESULTS }}
          RUN_ROWS: ${{ github.event.inputs.rows || '2000' }}
          RUN_SAVE_STEPS: ${{ github.event.inputs.save_steps || '100' }}
          RUN_MAX_MINUTES: ${{ github.event.inputs.max_minutes || '100' }}
        run: python run_daily.py

      - name: Upload artifacts (metrics + adapter config)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: finetune-output
          path: |
            out/
          if-no-files-found: ignore
          retention-days: 14
